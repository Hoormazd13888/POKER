<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>خرید اشتراک ربات قیمت TON</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
    body { background: #0f141d; color: #fff; padding: 16px; display: flex; flex-direction: column; align-items: center; }
    .container { width: 100%; max-width: 400px; }
    .card { background: #171e2c; border: 1px solid #26334d; border-radius: 16px; padding: 16px; margin-bottom: 14px; text-align: center; }
    .btn { background: #0088cc; color: #fff; border: none; padding: 12px 20px; border-radius: 10px; font-weight: bold; width: 100%; cursor: pointer; margin-top: 10px; font-size: 15px; }
    .btn-ton { background: linear-gradient(135deg, #0098EA, #00B1FF); }
    .btn-success { background: #28a745; }
    input { width: 100%; padding: 12px; background: #0b0f17; border: 1px solid #26334d; color: #fff; border-radius: 10px; margin-top: 10px; font-size: 15px; outline: none; }
    .plan-title { font-size: 18px; font-weight: bold; color: #00E5FF; margin-bottom: 6px; }
  </style>
</head>
<body>

  <div class="container" id="app">
    <h2>📦 خرید اشتراک ارسال قیمت TON</h2>
    <div id="balanceBox" style="background: #1c2436; padding: 10px; border-radius: 10px; margin: 10px 0; text-align: center; font-weight: bold; color: #00E5FF;">موجودی شما: <span id="userBalance">0</span> TON</div>

    <div id="plansContainer"></div>

    <div class="card" id="channelBox" style="margin-top: 20px;">
      <h3 style="margin-bottom: 10px;">📢 ثبت کانال برای ربات</h3>
      <input type="text" id="channelInput" placeholder="@ChannelUsername" />
      <button class="btn btn-success" onclick="saveChannel()">ثبت کانال</button>
    </div>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) tg.expand();
    const user = tg?.initDataUnsafe?.user || { id: 123456789 };

    let appData = {};

    async function loadData() {
      try {
        const res = await fetch(`/api/data/${user.id}`);
        appData = await res.json();
        
        document.getElementById('userBalance').innerText = appData.balance;

        const container = document.getElementById('plansContainer');
        container.innerHTML = '';

        for (const [id, plan] of Object.entries(appData.plans)) {
          container.innerHTML += `
            <div class="card">
              <div class="plan-title">اشتراک ${plan.days} روزه</div>
              <div style="font-size: 20px; font-weight: bold; color: #FFD600; margin: 6px 0;">${plan.price} TON</div>
              <button class="btn btn-ton" onclick="buyPlan('${appData.wallet}', ${plan.price}, ${id})">پرداخت مستقیم با Tonkeeper 🚀</button>
            </div>
          `;
        }
      } catch (e) {
        console.error("Error loading data:", e);
      }
    }

    function buyPlan(wallet, amount, planId) {
      const memo = user.id; 
      const nanoTon = amount * 1e9;
      const tonkeeperUrl = `https://app.tonkeeper.com/transfer/${wallet}?amount=${nanoTon}&text=${memo}`;

      window.open(tonkeeperUrl, '_blank');
      
      setTimeout(() => {
        verifyPayment(planId);
      }, 3000);
    }

    async function verifyPayment(planId) {
      try {
        const res = await fetch('/api/verify-payment', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ userId: user.id, planId })
        });
        const data = await res.json();
        alert(data.message);
        loadData();
      } catch (e) {
        alert("خطا در بررسی پرداخت.");
      }
    }

    async function saveChannel() {
      const channelUsername = document.getElementById('channelInput', user.id).value;
      if (!channelUsername) {
        alert("لطفاً آیدی کانال را وارد کنید.");
        return;
      }
      try {
        const res = await fetch('/api/set-channel', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ userId: user.id, channelUsername })
        });
        const data = await res.json();
        alert(data.message);
      } catch (e) {
        alert("خطا در ذخیره کانال.");
      }
    }

    loadData();
  </script>
</body>
</html>
