<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARENA - Battle Against Other Players</title>
    <link rel="stylesheet" href="/style.css">
    <script src="/socket.io/socket.io.js"></script>
</head>
<body>
    <div class="app-container">

        <!-- صفحه اصلی آرنا (دقیقاً شبیه عکس) -->
        <div id="page-arena" class="app-page active">
            <!-- هدر و تاج پادشاهی -->
            <div class="arena-header-banner">
                <div class="crown-icon">👑</div>
                <div class="crossed-swords">⚔️</div>
                <h1 class="arena-title">ARENA</h1>
                <p class="arena-subtitle">BATTLE AGAINST OTHER PLAYERS</p>
                <div class="red-glow-line"></div>
            </div>

            <!-- کارت حالت بازی (Arena Mode) -->
            <div class="mode-card">
                <div class="mode-icon">⚔️</div>
                <div class="mode-info">
                    <h3>Arena Mode</h3>
                    <p>Compete in real-time battles and win rewards!</p>
                </div>
                <div class="arrow-right">›</div>
            </div>

            <!-- آمار بازیکنان و استخر جایزه (دقیقاً مشابه عکس) -->
            <div class="stats-row">
                <div class="stat-box">
                    <div class="stat-label">👥 Players</div>
                    <div class="stat-value" id="players-count-val">16128</div>
                </div>
                <div class="stat-box">
                    <div class="stat-label">🏆 Prize Pool</div>
                    <div class="stat-value"><span id="prize-pool-val">0.0516</span> TON 💎</div>
                </div>
            </div>

            <!-- دکمه بزرگ و فوق‌العاده BATTLE -->
            <button class="battle-btn" onclick="joinBattle(0.01)">
                <span>⚔️ BATTLE &gt;&gt;</span>
            </button>
        </div>

        <!-- صفحه پروفایل -->
        <div id="page-profile" class="app-page">
            <div class="top-header"><div class="brand-title">👤 <strong>Profile</strong></div></div>
            <div class="profile-card">
                <div class="profile-avatar">⚔️</div>
                <h3>WARRIOR</h3>
                <p>Total Wins Volume: <span id="profile-vol">0.00</span> TON</p>
            </div>
        </div>

        <!-- منوی پایین صفحه (مشابه عکس مرجع با سه گزینه Games، Arena، Profile) -->
        <nav class="bottom-nav">
            <button class="nav-item" onclick="switchTab('games', this)">
                <span>🎮</span>
                <span>Games</span>
            </button>
            <button class="nav-item active" onclick="switchTab('arena', this)">
                <span>👑</span>
                <span>Arena</span>
            </button>
            <button class="nav-item" onclick="switchTab('profile', this)">
                <span>👤</span>
                <span>Profile</span>
            </button>
        </nav>
    </div>

    <script>
        const socket = io();
        let myBalance = 10.00;

        function switchTab(tab, btn) {
            document.querySelectorAll('.app-page').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));

            if (tab === 'arena' || tab === 'games') document.getElementById('page-arena').classList.add('active');
            if (tab === 'profile') document.getElementById('page-profile').classList.add('active');
            btn.classList.add('active');
        }

        socket.on('state', (state) => {
            document.getElementById('prize-pool-val').innerText = state.bank.toFixed(4);
            document.getElementById('players-count-val').innerText = state.playersCount;
        });

        function joinBattle(amount) {
            if (myBalance < amount) {
                alert("Insufficient balance!");
                return;
            }
            myBalance -= amount;
            socket.emit('join_game', { name: "WARRIOR", amount: amount });
            alert("🚀 Successfully entered the Arena battle!");
        }
    </script>
</body>
</html>
