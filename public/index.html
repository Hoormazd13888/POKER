<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>TON Arena & Roulette</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: #0b0e14; color: #fff; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding-bottom: 80px; user-select: none; }
    .view { display: none; width: 100%; max-width: 420px; padding: 16px; flex-direction: column; align-items: center; }
    .view.active { display: flex; }

    .top-bar { width: 100%; max-width: 420px; display: flex; justify-content: space-between; align-items: center; background: #131823; padding: 12px 16px; border-bottom: 1px solid #1e2636; margin-bottom: 16px; }
    .balance-badge { background: #1c2436; padding: 6px 12px; border-radius: 12px; font-weight: bold; color: #00E5FF; font-size: 14px; border: 1px solid #28334d; }

    .home-banner { background: linear-gradient(135deg, #FFD600, #FF6D00); width: 100%; padding: 16px; border-radius: 16px; color: #000; font-weight: bold; margin-bottom: 16px; text-align: center; }
    .game-cards-grid { display: grid; grid-template-columns: 1fr; gap: 14px; width: 100%; }
    .game-card { background: #171d2c; border-radius: 20px; padding: 20px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; border: 1px solid #232d42; }
    .card-arena { background: linear-gradient(135deg, #1b365d, #0f223f); border-color: #2979FF; }
    .card-wheel { background: linear-gradient(135deg, #123524, #0b2217); border-color: #00E676; }
    .card-title { font-size: 20px; font-weight: bold; margin-bottom: 4px; }
    .card-desc { font-size: 13px; color: #94a3b8; }

    /* استایل‌های مشترک بازی‌ها (شبیه تصویر ارسالی شما) */
    .game-header { width: 100%; display: flex; justify-content: space-between; align-items: center; background: #171d2c; padding: 12px 16px; border-radius: 14px; margin-bottom: 14px; border: 1px solid #232d42; }
    .pot-box { font-size: 16px; font-weight: bold; color: #00E5FF; }
    .timer-box { background: #222b3d; padding: 6px 12px; border-radius: 10px; font-weight: bold; color: #FFD600; font-size: 13px; }

    .rooms-selector { display: flex; gap: 8px; margin-bottom: 12px; width: 100%; }
    .room-btn { flex: 1; background: #171d2c; border: 1px solid #232d42; color: #94a3b8; padding: 8px; border-radius: 10px; font-weight: bold; cursor: pointer; }
    .room-btn.active { background: #2979FF; color: #fff; border-color: #2979FF; }

    /* باکس مربعی آرنا */
    .arena-box { width: 100%; height: 260px; background: linear-gradient(135deg, #ff2e93, #2979FF); border-radius: 20px; position: relative; display: flex; justify-content: center; align-items: center; overflow: hidden; margin-bottom: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    .arena-inner-circle { width: 90px; height: 90px; background: rgba(15, 22, 36, 0.85); border-radius: 50%; display: flex; flex-direction: column; justify-content: center; align-items: center; font-weight: bold; border: 3px solid rgba(255,255,255,0.3); z-index: 5; }

    /* دایره رولت */
    .wheel-container { position: relative; width: 260px; height: 260px; margin: 10px 0 20px; display: flex; justify-content: center; align-items: center; }
    .pointer { position: absolute; top: -10px; left: 50%; transform: translateX(-50%); width: 0; height: 0; border-left: 12px solid transparent; border-right: 12px solid transparent; border-top: 22px solid #fff; z-index: 10; }
    canvas { border-radius: 50%; box-shadow: 0 0 25px rgba(0, 229, 255, 0.2); transition: transform 4.8s cubic-bezier(0.15, 0.85, 0.25, 1); }

    .controls { width: 100%; background: #171d2c; padding: 14px; border-radius: 16px; border: 1px solid #232d42; margin-bottom: 14px; }
    .bet-presets { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 10px; }
    .preset-btn { background: #222b3d; border: 1px solid #323f59; color: #fff; padding: 8px 0; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 13px; }
    .custom-bet { display: flex; gap: 8px; }
    input { flex: 1; background: #0b0e14; border: 1px solid #323f59; color: #fff; padding: 10px; border-radius: 8px; font-size: 15px; outline: none; }
    .join-btn { background: linear-gradient(135deg, #00E5FF, #2979FF); border: none; color: #fff; font-weight: bold; padding: 0 20px; border-radius: 8px; cursor: pointer; font-size: 14px; }
    
    .players-list { width: 100%; display: flex; flex-direction: column; gap: 6px; }
    .player-card { background: #171d2c; padding: 8px 12px; border-radius: 10px; display: flex; justify-content: space-between; align-items: center; border-right: 4px solid #fff; font-size: 14px; }

    .wallet-box { background: #171d2c; width: 100%; padding: 20px; border-radius: 16px; text-align: center; border: 1px solid #232d42; margin-bottom: 16px; }
    .wallet-btns { display: flex; gap: 10px; margin-top: 14px; }
    .wallet-action-btn { flex: 1; padding: 12px; border-radius: 10px; border: none; font-weight: bold; cursor: pointer; }
    .deposit-btn { background: #00E676; color: #000; }
    .withdraw-btn { background: #FF3D71; color: #fff; }

    .nav-bar { position: fixed; bottom: 0; left: 0; right: 0; height: 70px; background: #131823; display: flex; justify-content: space-around; align-items: center; border-top: 1px solid #1e2636; z-index: 1000; }
    .nav-item { display: flex; flex-direction: column; align-items: center; color: #64748b; cursor: pointer; font-size: 12px; font-weight: bold; }
    .nav-item.active { color: #00E5FF; }
    .nav-item span { font-size: 20px; margin-bottom: 2px; }

    .winner-banner { position: fixed; top: 25%; background: rgba(19, 24, 35, 0.98); border: 2px solid #00E676; padding: 20px 28px; border-radius: 16px; text-align: center; z-index: 2000; display: none; }
  </style>
</head>

  <div class="top-bar">
    <div style="font-weight: bold; font-size: 16px;">🎮 TON Arcade</div>
    <div class="balance-badge" id="userBalance">0.00 TON</div>
  </div>

  <!-- تب خانه -->
  <div id="homeView" class="view active">
    <div class="home-banner">🔥 تورنمنت بزرگ آرنا و رولت</div>
    <div class="game-cards-grid">
      <div class="game-card card-arena" onclick="switchTab('arenaView')">
        <div>
          <div class="card-title">⚔️ آرنا (Arena)</div>
          <div class="card-desc">نبرد مربعی PvP (حداقل ۲ بازیکن)</div>
        </div>
        <div style="font-size: 28px;">➡️</div>
      </div>
      <div class="game-card card-wheel" onclick="switchTab('rouletteView')">
        <div>
          <div class="card-title">🎯 رولت (Wheel)</div>
          <div class="card-desc">چرخ شانس و استخرهای جایزه</div>
        </div>
        <div style="font-size: 28px;">➡️</div>
      </div>
    </div>
  </div>

  <!-- تب آرنا (مربعی) -->
  <div id="arenaView" class="view">

      <button class="room-btn active">اتاق ۱</button>
      <button class="room-btn">اتاق ۲</button>
    </div>

    <div class="game-header">
      <div>مجموع: <span class="pot-box" id="arenaPot">0 TON</span></div>
      <div class="timer-box" id="arenaTimer">منتظر نفر دوم...</div>
    </div>

    <div class="arena-box" id="arenaBox">
      <div class="arena-inner-circle" id="arenaCenterStatus">آماده</div>
    </div>

    <div class="controls">
      <div class="bet-presets">
        <button class="preset-btn" onclick="sendArenaBet(0.1)">0.1 TON</button>
        <button class="preset-btn" onclick="sendArenaBet(0.5)">0.5 TON</button>
        <button class="preset-btn" onclick="sendArenaBet(1)">1 TON</button>
        <button class="preset-btn" onclick="sendArenaBet(5)">5 TON</button>
      </div>
      <div class="custom-bet">
        <input type="number" id="arenaInput" step="0.1" min="0.1" placeholder="مبلغ (TON)" />
        <button class="join-btn" onclick="sendCustomArenaBet()">ورود به آرنا</button>
      </div>
    </div>

    <div class="players-list" id="arenaPlayersList"></div>
  </div>

  <!-- تب رولت (دایره‌ای) -->
  <div id="rouletteView" class="view">
    <div class="game-header">
      <div>مجموع: <span class="pot-box" id="potAmount">0 TON</span></div>
      <div class="timer-box" id="timerDisplay">منتظر نفر دوم...</div>
    </div>

    <div class="wheel-container">
      <div class="pointer"></div>
      <canvas id="wheelCanvas" width="260" height="260"></canvas>
      <div class="arena-inner-circle" style="position: absolute;" id="centerStatus">آماده</div>
    </div>

    <div class="controls">
      <div class="bet-presets">
        <button class="preset-btn" onclick="sendBet(0.1)">0.1 TON</button>
        <button class="preset-btn" onclick="sendBet(0.5)">0.5 TON</button>
        <button class="preset-btn" onclick="sendBet(1)">1 TON</button>
        <button class="preset-btn" onclick="sendBet(5)">5 TON</button>
      </div>
      <div class="custom-bet">
        <input type="number" id="betInput" step="0.1" min="0.1" placeholder="مبلغ (TON)" />
        <button class="join-btn" onclick="sendCustomBet()">ورود به رولت</button>
      </div>
    </div>

    <div class="players-list" id="playersList"></div>
  </div>
