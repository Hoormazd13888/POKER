<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Arena & Roulette</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: #080511; color: #ffffff; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding-bottom: 80px; user-select: none; }
    .view { display: none; width: 100%; max-width: 420px; padding: 16px; flex-direction: column; align-items: center; }
    .view.active { display: flex; }

    .top-bar { width: 100%; max-width: 420px; display: flex; justify-content: space-between; align-items: center; background: #130b26; padding: 12px 16px; border-bottom: 1px solid #281750; margin-bottom: 16px; }
    .balance-badge { background: #1f113a; padding: 6px 12px; border-radius: 12px; font-weight: bold; color: #00E5FF; font-size: 14px; border: 1px solid #3d2275; display: flex; align-items: center; gap: 6px; }

    .home-banner { background: linear-gradient(135deg, #7c3aed, #4f46e5); width: 100%; padding: 20px; border-radius: 20px; font-weight: bold; margin-bottom: 16px; text-align: center; box-shadow: 0 8px 20px rgba(124, 58, 237, 0.3); }
    .game-cards-grid { display: grid; grid-template-columns: 1fr; gap: 14px; width: 100%; }
    .game-card { background: #130b26; border-radius: 20px; padding: 20px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; border: 1px solid #281750; }
    .card-arena { border-color: #7c3aed; background: linear-gradient(135deg, #180e30, #0f0820); }
    .card-wheel { border-color: #00E5FF; background: linear-gradient(135deg, #0b1a26, #070f17); }
    .card-title { font-size: 20px; font-weight: bold; margin-bottom: 4px; }
    .card-desc { font-size: 13px; color: #94a3b8; }

    .game-header { width: 100%; display: flex; justify-content: space-between; align-items: center; background: #130b26; padding: 12px 16px; border-radius: 14px; margin-bottom: 14px; border: 1px solid #281750; }
    .pot-box { font-size: 16px; font-weight: bold; color: #00E5FF; }
    .timer-box { background: #1f113a; padding: 6px 12px; border-radius: 10px; font-weight: bold; color: #FFD600; font-size: 13px; }

    .wheel-container, .arena-box { position: relative; width: 260px; height: 260px; margin: 10px 0 20px; display: flex; justify-content: center; align-items: center; }
    .pointer { position: absolute; top: -10px; left: 50%; transform: translateX(-50%); width: 0; height: 0; border-left: 12px solid transparent; border-right: 12px solid transparent; border-top: 22px solid #FFD600; z-index: 10; }
    canvas { border-radius: 50%; box-shadow: 0 0 25px rgba(124, 58, 237, 0.4); transition: transform 4.8s cubic-bezier(0.15, 0.85, 0.25, 1); }
    
    .arena-box { background: linear-gradient(135deg, #180e30, #0b0511); border-radius: 20px; border: 2px solid #7c3aed; overflow: hidden; box-shadow: 0 0 25px rgba(124, 58, 237, 0.3); }
    .ball { position: absolute; width: 24px; height: 24px; background: #00E5FF; border-radius: 50%; box-shadow: 0 0 15px #00E5FF; transition: all 0.5s ease; }

    .finance-card { width: 100%; background: #130b26; border: 1px solid #281750; border-radius: 14px; padding: 12px; display: flex; justify-content: space-between; margin-bottom: 14px; font-size: 13px; text-align: center; }
    .finance-item { flex: 1; border-left: 1px solid #281750; }
    .finance-item:first-child { border-left: none; }

    .controls { width: 100%; background: #130b26; padding: 14px; border-radius: 16px; border: 1px solid #281750; margin-bottom: 14px; }
    .bet-presets { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 10px; }
    .preset-btn { background: #1f113a; border: 1px solid #3d2275; color: #fff; padding: 8px 0; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 13px; }
    .custom-bet { display: flex; gap: 8px; }
    input { flex: 1; background: #080511; border: 1px solid #3d2275; color: #fff; padding: 10px; border-radius: 8px; font-size: 15px; outline: none; }
    .join-btn { background: linear-gradient(135deg, #7c3aed, #4f46e5); border: none; color: #fff; font-weight: bold; padding: 0 20px; border-radius: 8px; cursor: pointer; font-size: 14px; }

    .players-list { width: 100%; display: flex; flex-direction: column; gap: 6px; }
    .player-card { background: #130b26; padding: 10px 14px; border-radius: 10px; display: flex; justify-content: space-between; align-items: center; border-right: 4px solid #fff; font-size: 14px; border: 1px solid #281750; }
    .player-info { display: flex; align-items: center; gap: 10px; }
    .player-avatar { width: 30px; height: 30px; border-radius: 50%; object-fit: cover; background: #333; }

    .wallet-box { background: #130b26; border: 1px solid #281750; width: 100%; padding: 20px; border-radius: 16px; text-align: center; margin-bottom: 16px; }
    .wallet-btns { display: flex; gap: 10px; margin-top: 14px; }
    .wallet-btn { flex: 1; padding: 12px; border-radius: 10px; border: none; font-weight: bold; cursor: pointer; }
    .deposit-btn { background: #00E676; color: #000; }
    .withdraw-btn { background: #FF3D71; color: #fff; }

    .nav-bar { position: fixed; bottom: 0; left: 0; right: 0; height: 70px; background: #130b26; display: flex; justify-content: space-around; align-items: center; border-top: 1px solid #281750; z-index: 1000; }
    .nav-item { display: flex; flex-direction: column; align-items: center; color: #64748b; cursor: pointer; font-size: 12px; font-weight: bold; }
    .nav-item.active { color: #00E5FF; }
    .nav-item span { font-size: 20px; margin-bottom: 2px; }

    .winner-banner { position: fixed; top: 25%; background: rgba(19, 11, 38, 0.98); border: 2px solid #00E676; padding: 20px 28px; border-radius: 16px; text-align: center; z-index: 2000; display: none; }
    .back-link { color: #94a3b8; font-size: 13px; margin-top: 10px; cursor: pointer; text-decoration: underline; }
  </style>
</head>
<body>

  <div class="top-bar">
    <div style="font-weight: bold; font-size: 16px; color:#7c3aed;">👑 Arena Bot</div>
    <div class="balance-badge" id="userBalance">💎 0 TON</div>
  </div>

  <!-- تب خانه -->
  <div id="homeView" class="view active">
    <div class="home-banner">⚡ به آرنا خوش
