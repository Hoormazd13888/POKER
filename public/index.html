<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XZ Gift - Arena</title>
    <link rel="stylesheet" href="style.css">
    <script src="/socket.io/socket.io.js"></script>
</head>
<body>
    <div class="app-container">
        <header class="header">
            <div class="live-badge">🟢 LIVE</div>
            <div class="balance-box">
                <span class="coin-icon">💎</span>
                <span id="user-balance">0.00</span>
                <button class="deposit-btn">Deposit</button>
            </div>
        </header>

        <div class="bank-section">
            <div class="bank-title">Bank <span id="bank-amount">0.00</span> TON</div>
        </div>

        <div class="arena-card">
            <div id="arena-wheel" class="wheel-box">
                <div id="timer-display" class="timer-badge">15</div>
            </div>
        </div>

        <div class="players-section">
            <div class="section-header">
                <h3>Players</h3>
                <span id="game-id">Game #16128</span>
            </div>
            <div id="players-list" class="players-list"></div>
        </div>

        <div class="bet-controls">
            <button>0.01 💎</button>
            <button>0.1 💎</button>
            <button>1 💎</button>
            <button class="custom-bet">+</button>
        </div>
    </div>
</body>
</html>
