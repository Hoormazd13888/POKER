<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>TON Arena Battle</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body {
      background-color: #0e1015;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
      user-select: none;
    }
    .header {
      width: 100%;
      max-width: 420px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #171a23;
      padding: 12px 16px;
      border-radius: 16px;
      margin-bottom: 16px;
      border: 1px solid #262b38;
    }
    .pot-box { font-size: 18px; font-weight: bold; color: #00E5FF; }
    .timer-box {
      background: #232836;
      padding: 6px 14px;
      border-radius: 12px;
      font-weight: bold;
      color: #FFD600;
    }
    .arena-container {
      position: relative;
      width: 300px;
      height: 300px;
      margin: 10px 0 20px;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    /* نشانگر بالایی که برنده را نشان می‌دهد */
    .pointer {
      position: absolute;
      top: -12px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 14px solid transparent;
      border-right: 14px solid transparent;
      border-top: 24px solid #ffffff;
      z-index: 10;
      filter: drop-shadow(0 2px 6px rgba(0,0,0,0.8));
    }
    canvas {
      border-radius: 50%;
      box-shadow: 0 0 30px rgba(0, 229, 255, 0.15);
      transition: transform 4.8s cubic-bezier(0.15, 0.85, 0.25, 1);
    }
    .center-badge {
      position: absolute;
      width: 78px;
      height: 78px;
      background: #171a23;
      border-radius: 50%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      border: 3px solid #2b3142;
      font-weight: bold;
      font-size: 14px;
      z-index: 5;
    }
    .controls {
      width: 100%;
      max-width: 420px;
      background: #171a23;
      padding: 16px;
      border-radius: 16px;
      border: 1px solid #262b38;
      margin-bottom: 16px;
    }
    .bet-presets {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-bottom: 12px;
    }
    .preset-btn {
      background: #232836;
      border: 1px solid #32394d;
      color: #fff;
      padding: 10px 0;
      border-radius: 10px;
      font-weight: bold;
      cursor: pointer;
    }
    .preset-btn:active { background: #00E5FF; color: #000; }
    .custom-bet {
      display: flex;
      gap: 8px;
    }
    input {
      flex: 1;
      background: #0e1015;
      border: 1px solid #32394d;
      color: #fff;
      padding: 12px;
      border-radius: 10px;
      font-size: 16px;
      outline: none;
    }
    .join-btn {
      background: linear-gradient(135deg, #00E5FF, #2979FF);
      border: none;
      color: #fff;
      font-weight: bold;
      padding: 0 24px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 15px;
    }
    .players-list {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .player-card {
      background: #171a23;
      padding: 10px 14px;
      border-radius: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-right: 5px solid #fff;
    }
    .winner-banner {
      position: fixed;
      top: 20%;
      background: rgba(23, 26, 35, 0.96);
      border: 2px solid #00E676;
      padding: 24px 32px;
      border-radius: 20px;
      text-align: center;
      z-index: 100;
      display: none;
      box-shadow: 0 10px 40px rgba(0, 230, 118, 0.3);
    }
  </style>
</head>
<body>

  <div class="header">
    <div>مجموع: <span class="pot-box" id="potAmount">0 TON</span></div>
    <div class="timer-box" id="timerDisplay">در انتظار بازیکن...</div>
  </div>

  <div class="arena-container">
    <div class="pointer"></div>
    <canvas id="wheelCanvas" width="300" height="300"></canvas>
    <div class="center-badge" id="centerStatus">ARENA</div>
  </div>

  <div class="controls">
    <div class="bet-presets">
      <button class="preset-btn" onclick="sendBet(0.1)">0.1 TON</button>
      <button class="preset-btn" onclick="sendBet(0.5)">0.5 TON</button>
      <button class="preset-btn" onclick="sendBet(1)">1 TON</button>
      <button class="preset-btn" onclick="sendBet(5)">5 TON</button>
    </div>
    <div class="custom-bet">
      <input type="number" id="betInput" step="0.1" min="0.1" placeholder="مبلغ دلخواه (TON)" />
      <button class="join-btn" onclick="sendCustomBet()">ورود به بازی</button>
    </div>
  </div>

  <div class="players-list" id="playersList"></div>

  <div class="winner-banner" id="winnerBanner">
    <h2 style="color:#00E676; margin-bottom:8px;">🎉 برنده مشخص شد!</h2>
    <p id="winnerText" style="font-size:18px; font-weight:bold;"></p>
  </div>

  <script>
    const socket = io();
    const tg = window.Telegram?.WebApp;
    if (tg) tg.expand();

    // دریافت مشخصات کاربر از تلگرام یا ساخت آیدی تست برای مرورگر
    const user = tg?.initDataUnsafe?.user || {
      id: Math.floor(Math.random() * 100000).toString(),
      first_name: 'کاربر_' + Math.floor(Math.random() * 99)
    };

    const canvas = document.getElementById('wheelCanvas');
    const ctx = canvas.getContext('2d');
    let currentRotation = 0;

    function drawWheel(players) {
      ctx.clearRect(0, 0, 300, 300);
      if (!players || players.length === 0) {
        ctx.beginPath();
        ctx.arc(150, 150, 145, 0, Math.PI * 2);
        ctx.fillStyle = '#1f2430';
        ctx.fill();
        return;
      }

      players.forEach(p => {
        // تبدیل درجه به رادیان (شروع از بالای دایره -90 درجه)
        const startRad = ((p.startAngle - 90) * Math.PI) / 180;
        const endRad = ((p.endAngle - 90) * Math.PI) / 180;

        ctx.beginPath();
        ctx.moveTo(150, 150);
        ctx.arc(150, 150, 145, startRad, endRad);
        ctx.closePath();
        ctx.fillStyle = p.color;
        ctx.fill();
        ctx.lineWidth = 2;
        ctx.strokeStyle = '#0e1015';
        ctx.stroke();
      });
    }

    socket.on('gameState', (state) => {
      document.getElementById('potAmount').innerText = `${state.pot} TON`;

      if (state.status === 'WAITING') {
        document.getElementById('timerDisplay').innerText = 'در انتظار بازیکن...';
        document.getElementById('centerStatus').innerText = 'آماده';
        document.getElementById('winnerBanner').style.display = 'none';
        canvas.style.transition = 'none';
        canvas.style.transform = 'rotate(0deg)';
        currentRotation = 0;
      } else if (state.status === 'COUNTDOWN') {
        document.getElementById('timerDisplay').innerText = `شروع در 00:${state.timer < 10 ? '0' + state.timer : state.timer}`;
        document.getElementById('centerStatus').innerText = `${state.timer}s`;
      }

      if (state.status !== 'SPINNING') {
        drawWheel(state.players);
      }

      // بروزرسانی لیست بازیکنان
      const list = document.getElementById('playersList');
      list.innerHTML = '';
      state.players.forEach(p => {
        const div = document.createElement('div');
        div.className = 'player-card';
        div.style.borderRightColor = p.color;
        div.innerHTML = `
          <div>
            <strong>${p.name}</strong>
            <div style="font-size:12px; color:#8e96aa;">${p.bet} TON</div>
          </div>
          <div style="font-weight:bold; color:${p.color};">${p.percentage.toFixed(1)}%</div>
        `;
        list.appendChild(div);
      });
    });

    socket.on('spinStart', ({ winningAngle, winner, pot }) => {
      document.getElementById('timerDisplay').innerText = 'در حال چرخش...';
      document.getElementById('centerStatus').innerText = '🎲';

      // چرخش 6 دور کامل + زاویه دقیق توقف زیر نشانگر بالا
      const extraSpins = 360 * 6;
      const finalAngle = extraSpins + (360 - winningAngle);
      
      canvas.style.transition = 'transform 4.8s cubic-bezier(0.15, 0.85, 0.25, 1)';
      canvas.style.transform = `rotate(${finalAngle}deg)`;

      setTimeout(() => {
        const banner = document.getElementById('winnerBanner');
        document.getElementById('winnerText').innerText = `${winner.name} برنده ${pot} TON شد!`;
        banner.style.display = 'block';
      }, 4900);
    });

    function sendBet(amount) {
      socket.emit('placeBet', {
        userId: String(user.id),
        username: user.first_name,
        amount: amount
      });
    }

    function sendCustomBet() {
      const val = parseFloat(document.getElementById('betInput').value);
      if (val > 0) {
        sendBet(val);
        document.getElementById('betInput').value = '';
      }
    }
  </script>
</body>
</html>
